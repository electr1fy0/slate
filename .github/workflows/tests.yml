name: tests

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - name: Test Go backend
        run: go test -race ./...
      - name: Vet Go backend
        run: go vet ./...
      - name: Build deployment artifacts
        run: scripts/build_go.sh
