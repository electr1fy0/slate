[pytest]
testpaths = tests
addopts =
    --strict-markers
    --cov=app
    --cov=lambdas
    --cov=chaos
    --cov-branch
    --cov-report=term-missing
    --cov-fail-under=100
markers =
    e2e: end-to-end journey tests (local, fully mocked AWS)
    live: tests against a real deployed environment (opt-in via CONTINUUM_LIVE_TESTS=1)
filterwarnings =
    ignore::DeprecationWarning:fastapi.*
